<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <footer class="footer">

        <h2 class="titulofooter">Contato</h2>
            <h4 class="nossocontato">Para você nos contatar!</h4>
            <p class="pcontato">Nosso e-mail: Feral@gmail.com</p>
            <p class="pcontato2">Nosso telefone: +55 51 98765-4321</p>

            <h4 class="formcontato">Para podermos entrar em contato com você!</h4>
        
            <form class="formulario">
            <label for="nome">Seu nome: </label>
            <input id="nome" type="text" placeholder="Nome..." required><br><br>

            <label for="telefone">Seu telefone</label>
            <input id="telefone" type="tel" placeholder="+55 51 98765-4321" required><br><br>
            
            <label for="email">Seu email</label>
            <input id="email" type="email" placeholder="exemplo@email.com" required><br>
            
            <input type="submit" class="enviar" value="Enviar">
        </form>
        <div class="footertexto">
            <p class="paragrafofooter">© 2026 FERAL. Todos os direitos reservados.</p>
            <p class="paragrafofooter2">Privacidade · Termos de Uso · Cookies · Acessibilidade</p>
        </div>
    </footer>
</body>
</html>
